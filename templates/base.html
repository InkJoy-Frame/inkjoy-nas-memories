<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InkJoy Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-mark.png') }}">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script>
    window.INKJOY_ACCOUNT_ID = {{ session.get('account_id', 0) | tojson }};

    const _origFetch = window.fetch;
    window.fetch = async function(...args) {
      const resp = await _origFetch(...args);
      if (resp.status === 401) {
        const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
        if (url.startsWith('/api/')) { window.location.href = '/login'; return resp; }
      }
      return resp;
    };
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  {% if session.get('token') %}
  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="/" title="Home">
        <img src="{{ url_for('static', filename='images/logo-white.svg') }}" alt="InkJoy" class="navbar-logo-img">
      </a>
      <div class="navbar-right">
        <button class="lang-btn" id="langBtn"
                onclick="setLang(getLang()==='en'?'zh':'en')">中文</button>
        <span class="server-tag">
          {% if session.server_key == 'global' %}Global{% else %}China{% endif %}
        </span>
        <a class="btn-logout" href="{{ url_for('logout') }}" data-i18n="nav.logout">Sign Out</a>
      </div>
    </div>
  </header>

  <!-- 主内容区（无侧边栏） -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  {% endif %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
