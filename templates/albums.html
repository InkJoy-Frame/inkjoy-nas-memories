{% extends 'base.html' %}
{% block title %}Albums - InkJoy Manager{% endblock %}

{% block content %}
<!-- ═══ 相册列表视图 ═══ -->
<div id="albumsListView">

  <!-- NAS 相册 -->
  <div class="section-title">
    <span class="section-icon">📁</span>
    <span data-i18n="albums.nas">NAS Albums</span>
    <span class="count-tag" id="nasCount"></span>
  </div>
  <div class="album-grid" id="nasAlbumGrid">
    <div class="album-card-new" onclick="openNewAlbumModal()">
      <span class="plus">+</span>
      <span class="label" data-i18n="albums.nas.new">New NAS Album</span>
    </div>
  </div>

  <!-- 云端相册 -->
  <div class="section-title section-gap">
    <span class="section-icon">☁️</span>
    <span data-i18n="albums.cloud">Cloud Albums</span>
    <span class="count-tag" id="cloudCount"></span>
  </div>
  <div class="album-grid" id="cloudAlbumGrid">
    <div id="cloudLoading" class="album-empty-hint">
      <div class="spinner-border spinner-border-sm"></div>
    </div>
  </div>
</div>

<!-- ═══ 相册详情视图 ═══ -->
<div id="albumDetailView" class="d-none">
  <div class="album-detail-header">
    <button class="album-back-btn" onclick="showAlbumsList()">
      ← <span data-i18n="albums.back">Albums</span>
    </button>
    <h2 class="album-detail-title" id="albumDetailTitle"></h2>
  </div>
  <div class="photo-grid" id="photoGrid"></div>
  <div id="photoEmpty" class="album-empty-hint d-none">
    <span data-i18n="albums.photos.empty">No photos in this album</span>
  </div>
  <div id="photoLoading" class="album-empty-hint d-none">
    <div class="spinner-border spinner-border-sm"></div>
  </div>
</div>

<!-- ═══ 自定义 Modal（对齐 webtool 样式） ═══ -->
<div id="inkModal" class="ink-modal-overlay" style="display:none" onclick="if(event.target===this)inkModalCancel()">
  <div class="ink-modal-box">
    <div class="ink-modal-title" id="inkModalTitle"></div>
    <div class="ink-modal-body" id="inkModalBody"></div>
    <div class="ink-modal-footer" id="inkModalFooter"></div>
  </div>
</div>

<!-- ═══ Lightbox ═══ -->
<div id="photoLightbox" class="photo-lightbox d-none" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function countLabel(n) { return n + (getLang() === 'zh' ? ' 个' : ''); }

// ── 相册列表 ────────────────────────────────────────────────────────────────

async function loadNasAlbums() {
  const resp = await fetch('/api/nas-albums');
  const data = await resp.json();
  if (!data.success) return;

  document.getElementById('nasCount').textContent = countLabel(data.albums.length);
  const grid = document.getElementById('nasAlbumGrid');
  grid.querySelectorAll('.album-card').forEach(c => c.remove());

  data.albums.forEach(a => {
    const card = document.createElement('div');
    card.className = 'album-card';
    card.onclick = () => openAlbum('nas', a.id, a.name);

    const coverHtml = a.coverPath
      ? `<img src="/api/image?path=${encodeURIComponent(a.coverPath)}&thumb=true" alt="" loading="lazy">`
      : '<span class="placeholder">🖼️</span>';

    card.innerHTML = `
      <div class="album-cover">${coverHtml}</div>
      <div class="album-info">
        <div class="album-name" title="${esc(a.name)}">${esc(a.name)}</div>
        <div class="album-count">📷 ${a.imgCount ?? 0}</div>
      </div>
      <button class="album-menu-btn" onclick="event.stopPropagation();showNasMenu(event,${a.id},'${esc(a.name)}')" title="⋮">⋮</button>`;

    grid.appendChild(card);
  });
}

async function loadCloudAlbums() {
  const grid = document.getElementById('cloudAlbumGrid');

  try {
    const resp = await fetch('/api/cloud-albums');
    const data = await resp.json();
    grid.innerHTML = '';

    if (!data.success || !data.albums?.length) {
      grid.innerHTML = `<div class="album-empty-hint"><span>${t('albums.cloud.empty')}</span></div>`;
      document.getElementById('cloudCount').textContent = '0';
      return;
    }

    document.getElementById('cloudCount').textContent = countLabel(data.albums.length);

    data.albums.forEach(a => {
      const card = document.createElement('div');
      card.className = 'album-card';
      card.onclick = () => openAlbum('cloud', a.albumId, a.albumName);

      const coverHtml = a.coverImgThumbnail
        ? `<img src="${esc(a.coverImgThumbnail)}" alt="" loading="lazy">`
        : '<span class="placeholder">🖼️</span>';

      card.innerHTML = `
        <div class="album-cover">${coverHtml}</div>
        <div class="album-info">
          <div class="album-name" title="${esc(a.albumName)}">${esc(a.albumName)}</div>
          <div class="album-count">📷 ${a.imgCount ?? 0}</div>
        </div>`;

      grid.appendChild(card);
    });
  } catch (e) {
    grid.innerHTML = `<div class="album-empty-hint text-danger">${esc(e.message)}</div>`;
  }
}

// ── NAS 相册操作 ─────────────────────────────────────────────────────────────

function showNasMenu(e, id, name) {
  const existing = document.querySelector('.album-menu-dropdown');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.className = 'album-menu-dropdown';
  menu.innerHTML = `
    <button onclick="renameNasAlbum(${id},'${esc(name)}')">${t('albums.menu.rename')}</button>
    <button class="text-danger" onclick="deleteNasAlbum(${id},'${esc(name)}')">${t('albums.menu.delete')}</button>`;

  document.body.appendChild(menu);
  const rect = e.target.getBoundingClientRect();
  menu.style.top = rect.bottom + 4 + 'px';
  menu.style.left = rect.left + 'px';

  setTimeout(() => {
    document.addEventListener('click', function handler() {
      menu.remove();
      document.removeEventListener('click', handler);
    }, { once: true });
  }, 0);
}

async function renameNasAlbum(id, oldName) {
  document.querySelector('.album-menu-dropdown')?.remove();
  const name = await inkPrompt(t('albums.menu.rename.prompt'), oldName, oldName);
  if (!name || name.trim() === oldName) return;

  const resp = await fetch(`/api/nas-albums/${id}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name.trim()}),
  });
  const data = await resp.json();
  if (data.success) loadNasAlbums();
  else alert(data.error);
}

async function deleteNasAlbum(id, name) {
  document.querySelector('.album-menu-dropdown')?.remove();
  const ok = await inkConfirm(
    t('albums.menu.delete'),
    t('albums.menu.delete.confirm', {name}),
  );
  if (!ok) return;

  const resp = await fetch(`/api/nas-albums/${id}`, {method: 'DELETE'});
  const data = await resp.json();
  if (data.success) loadNasAlbums();
  else alert(data.error);
}

// ── 通用 Modal（对齐 webtool） ───────────────────────────────────────────────

let _inkModalResolve = null;

function inkModalShow(title, bodyHtml, actions) {
  document.getElementById('inkModalTitle').textContent = title;
  document.getElementById('inkModalBody').innerHTML = bodyHtml;

  const footer = document.getElementById('inkModalFooter');
  footer.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'ink-btn ' + (a.cls || '');
    btn.textContent = a.label;
    btn.onclick = a.onClick;
    footer.appendChild(btn);
  });

  document.getElementById('inkModal').style.display = '';
}

function inkModalHide() {
  document.getElementById('inkModal').style.display = 'none';
  if (_inkModalResolve) { _inkModalResolve(null); _inkModalResolve = null; }
}

function inkModalCancel() { inkModalHide(); }

function inkPrompt(title, placeholder, defaultValue) {
  return new Promise(resolve => {
    _inkModalResolve = resolve;

    const submit = () => {
      const val = document.getElementById('ink-modal-input')?.value.trim();
      _inkModalResolve = null;
      inkModalHide();
      resolve(val || null);
    };

    inkModalShow(title,
      `<input type="text" id="ink-modal-input" class="ink-modal-input"
        placeholder="${esc(placeholder)}" value="${esc(defaultValue || '')}" maxlength="50">`,
      [
        { label: t('albums.modal.cancel'), cls: 'ink-btn-secondary', onClick: () => { _inkModalResolve = null; inkModalHide(); resolve(null); } },
        { label: t('albums.modal.ok'), cls: 'ink-btn-primary', onClick: submit },
      ]
    );

    setTimeout(() => {
      const input = document.getElementById('ink-modal-input');
      if (input) { input.focus(); input.select(); input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }); }
    }, 50);
  });
}

function inkConfirm(title, message) {
  return new Promise(resolve => {
    _inkModalResolve = resolve;

    inkModalShow(title,
      `<p style="margin:0;white-space:pre-line">${esc(message)}</p>`,
      [
        { label: t('albums.modal.cancel'), cls: 'ink-btn-secondary', onClick: () => { _inkModalResolve = null; inkModalHide(); resolve(false); } },
        { label: t('albums.modal.ok'), cls: 'ink-btn-danger', onClick: () => { _inkModalResolve = null; inkModalHide(); resolve(true); } },
      ]
    );
  });
}

// ── 新建 NAS 相册（两步流程） ────────────────────────────────────────────────

async function openNewAlbumModal() {
  const name = await inkPrompt(t('albums.modal.title'), t('albums.modal.name.ph'));
  if (!name) return;

  showFolderPicker(name);
}

let _pickerAlbumName = '';
let _pickerSelectedPath = null;

function showFolderPicker(albumName) {
  _pickerAlbumName = albumName;
  _pickerSelectedPath = null;

  const bodyHtml = `
    <div class="folder-browser-inline">
      <nav class="folder-breadcrumb" id="folderBreadcrumb"></nav>
      <div class="folder-list" id="folderList"></div>
    </div>`;

  inkModalShow(t('albums.modal.folder.title'), bodyHtml, [
    { label: t('albums.modal.cancel'), cls: 'ink-btn-secondary', onClick: inkModalCancel },
    { label: t('albums.modal.ok'), cls: 'ink-btn-primary', onClick: () => {
      if (_pickerSelectedPath === null) return;
      confirmCreateAlbum(_pickerAlbumName, _pickerSelectedPath);
    }},
  ]);

  updatePickerOkBtn();
  browseFolders('', albumName);
}

function updatePickerOkBtn() {
  const btns = document.querySelectorAll('#inkModalFooter .ink-btn-primary');
  const okBtn = btns[btns.length - 1];
  if (okBtn) {
    okBtn.disabled = _pickerSelectedPath === null;
    okBtn.style.opacity = _pickerSelectedPath === null ? '.4' : '';
  }
}

function selectPickerFolder(path) {
  _pickerSelectedPath = path;
  document.querySelectorAll('.folder-check').forEach(el => {
    el.classList.toggle('checked', el.dataset.path === path);
  });
  updatePickerOkBtn();
}

async function browseFolders(path, albumName) {
  const resp = await fetch('/api/browse?path=' + encodeURIComponent(path));
  const data = await resp.json();
  if (!data.success) return;

  const parts = path ? path.split('/').filter(Boolean) : [];
  let bc = `<span class="folder-bc-item" onclick="browseFolders('','${esc(albumName)}')">${t('albums.folder.root')}</span>`;
  let built = '';
  parts.forEach(p => {
    built += (built ? '/' : '') + p;
    const bp = built;
    bc += ` / <span class="folder-bc-item" onclick="browseFolders('${bp}','${esc(albumName)}')">${esc(p)}</span>`;
  });
  document.getElementById('folderBreadcrumb').innerHTML = bc;

  const dirs = data.items.filter(i => i.type === 'dir');
  const imgCount = data.items.filter(i => i.type === 'image').length;
  const curLabel = parts.length ? parts[parts.length - 1] : t('albums.folder.root');
  const checkedCls = p => _pickerSelectedPath === p ? 'checked' : '';

  let html = '';

  html += `<div class="folder-item folder-item-current" onclick="selectPickerFolder('${esc(path)}')">
    <span class="folder-check ${checkedCls(path)}" data-path="${esc(path)}"></span>
    <span class="folder-item-label">📂 ${esc(curLabel)}</span>
    <span class="folder-item-meta">${imgCount ? '📷 ' + imgCount : ''}</span>
  </div>`;

  if (path) {
    const parent = path.includes('/') ? path.substring(0, path.lastIndexOf('/')) : '';
    html += `<div class="folder-item folder-item-sub" onclick="browseFolders('${parent}','${esc(albumName)}')">
      <span class="folder-item-label">⬆️ ..</span>
    </div>`;
  }

  dirs.forEach(d => {
    html += `<div class="folder-item folder-item-sub">
      <span class="folder-check ${checkedCls(d.path)}" data-path="${esc(d.path)}" onclick="event.stopPropagation();selectPickerFolder('${esc(d.path)}')"></span>
      <span class="folder-item-label" onclick="browseFolders('${d.path}','${esc(albumName)}')">📁 ${esc(d.name)}</span>
    </div>`;
  });

  document.getElementById('folderList').innerHTML = html;
}

async function confirmCreateAlbum(name, folderPath) {
  const resp = await fetch('/api/nas-albums', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, folder_path: folderPath}),
  });
  const data = await resp.json();

  inkModalHide();

  if (data.success) {
    loadNasAlbums();
  } else {
    alert(data.error);
  }
}

// ── 打开相册详情 ──────────────────────────────────────────────────────────────

function showAlbumsList() {
  document.getElementById('albumsListView').classList.remove('d-none');
  document.getElementById('albumDetailView').classList.add('d-none');
}

const photoMappers = {
  nas: p => ({
    thumbUrl: `/api/image?path=${encodeURIComponent(p.path)}&thumb=true`,
    fullUrl: `/api/image?path=${encodeURIComponent(p.path)}`,
    name: p.name,
  }),
  cloud: p => ({
    thumbUrl: p.thumbnailUrl,
    fullUrl: p.originUrl || p.thumbnailUrl,
    name: '',
  }),
};

async function openAlbum(type, id, name) {
  document.getElementById('albumsListView').classList.add('d-none');
  document.getElementById('albumDetailView').classList.remove('d-none');
  document.getElementById('albumDetailTitle').textContent = name;
  document.getElementById('photoGrid').innerHTML = '';
  document.getElementById('photoEmpty').classList.add('d-none');
  document.getElementById('photoLoading').classList.remove('d-none');

  const url = type === 'nas' ? `/api/nas-albums/${id}/photos` : `/api/cloud-albums/${id}/photos`;

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    document.getElementById('photoLoading').classList.add('d-none');

    if (!data.success || !data.photos?.length) {
      document.getElementById('photoEmpty').classList.remove('d-none');
      return;
    }

    renderPhotoGrid(data.photos.map(photoMappers[type]));
  } catch (e) {
    document.getElementById('photoLoading').classList.add('d-none');
    document.getElementById('photoEmpty').classList.remove('d-none');
    document.getElementById('photoEmpty').textContent = e.message;
  }
}

function renderPhotoGrid(photos) {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = photos.map(p => `
    <div class="photo-item" onclick="openLightbox('${esc(p.fullUrl)}')">
      <img src="${esc(p.thumbUrl)}" alt="${esc(p.name)}" loading="lazy">
    </div>`).join('');
}

// ── Lightbox ─────────────────────────────────────────────────────────────────

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('photoLightbox').classList.remove('d-none');
}

function closeLightbox() {
  document.getElementById('photoLightbox').classList.add('d-none');
  document.getElementById('lightboxImg').src = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ── Init ─────────────────────────────────────────────────────────────────────
loadNasAlbums();
loadCloudAlbums();
</script>
{% endblock %}
